      const r = st.d1[it.id]; if (!r || r.v !== 'fix') return;
      if (it.step === 'images' && c.redoImages.length) out.push(Object.assign({}, it, { id: it.id + 'r', base: it.id, src: c.redoImages[k++ % c.redoImages.length], beforeSrc: it.src, rewrite: true }));
      if (it.step === 'adtext' && c.redo[it.id]) out.push(Object.assign({}, it, { id: it.id + 'r', base: it.id, lines: c.redo[it.id], rewrite: true }));
    });
    return out;
  }
  const rewrites = () => rewritesFor(C, S);
  function queue() {
    if (S.round === 1) return R1;
    const rw = rewrites();
    if (!S.everything) return rw;
    return R1.flatMap(it => {
      const r = S.d1[it.id]; if (!r || r.v === 'kill') return [];
      const x = rw.find(w => w.base === it.id);
      if (x) return [x];
      return r.v === 'keep' ? [Object.assign({}, it, { id: it.id + 'k', kept: true })] : [];
    });
  }

  // Where each campaign stands, most urgent first.
  function status(c) {
    const st = stOf(c); const items = flat(c);
    const done1 = items.filter(it => st.d1[it.id] && st.d1[it.id].v).length;
    const rw = rewritesFor(c, st);
    const done2 = rw.filter(it => st.d2[it.id] && st.d2[it.id].v).length;
    if (st.sent1 && rw.length && !st.sent2) return { rank: 0, dot: 'is-go', label: done2 ? `Rewrite · ${done2} of ${rw.length}` : 'Studio\'s rewrite is ready', button: 'Review Studio\'s rewrite', frac: done2 / rw.length };
    if (done1 && done1 < items.length) return { rank: 1, dot: 'is-go', label: `${done1} of ${items.length} reviewed`, button: 'Keep going', frac: done1 / items.length };
    if (done1 === items.length && !st.sent1) return { rank: 1, dot: 'is-go', label: 'Ready to send', button: 'Send to Studio', frac: 1 };
    if (!done1) return { rank: 2, dot: '', label: 'Waiting on you', button: 'Start review', frac: 0 };
    return { rank: 3, dot: 'is-done', label: 'Done', button: 'See results', frac: 1 };
  }
  const ordered = () => ALL.slice().sort((a, b) => status(a).rank - status(b).rank || a.date.localeCompare(b.date));
  function summary(c) {
    return c.steps.map(s => s.items.length + ' ' + KIND_WORD[s.key][s.items.length === 1 ? 0 : 1]).join(' · ');
  }

  // ---------- Home: the campaigns waiting on you ----------
  function renderHome() {
    const list = ordered(); const top = list[0]; const ts = status(top);
    const allDone = list.every(c => status(c).rank === 3);
    const cards = list.map((c, n) => {
      const s = status(c);
      return `<button class="card" data-open="${c.id}" style="--g:${CARD_GRAD[ALL.indexOf(c) % CARD_GRAD.length]}">
        <span class="num" aria-hidden="true">${n + 1}</span>
        <span class="txt"><small>${esc(c.date)} · ${flat(c).length} pieces</small><strong>${esc(c.name.toUpperCase())}</strong></span>
        <span class="status"><i class="dot ${s.dot}"></i>${esc(s.label)}</span>
        <span class="bar"><i style="width:${s.frac * 100}%"></i></span></button>`;
    }).join('');
    app.innerHTML = `<div class="home">
      <section class="hero gutter">
        <div class="ghost" aria-hidden="true">REVIEW</div>
        <nav class="nav"><span class="logo">STUDIO</span></nav>
        <div class="hero-inner">
          <div class="badge eyebrow"><b>S</b> ${allDone ? 'All caught up' : esc(ts.label)} · ${esc(top.date)}</div>
          <h1 class="display"><span class="offer">${esc(top.offer.toUpperCase())}</span>${esc(top.name.toUpperCase())}</h1>
          <p>${esc(summary(top))}</p>
          <button class="btn primary" data-open="${top.id}">▶ ${esc(ts.button)}</button>
        </div>
      </section>
      <section class="row gutter"><h2>${allDone ? 'Reviewed' : 'Waiting on you'}</h2><div class="cards">${cards}</div></section>
    </div>`;
  }
  function open(id) {
    use(id); const s = status(C);
    if (s.rank === 0) return startRound(2);
    if (s.rank === 3 || s.button === 'Send to Studio') { S.round = 1; return go('done'); }
    return startRound(1);
  }

  // ---------- Review ----------
  function renderReview(anim) {
    const q = queue(); const it = q[S.i];
    if (!it) return finishRound();
    const r = rec(it.id);
    const s = stepOf(it.step);
    const num = s.items.findIndex(x => x.id === (it.base || it.id.replace(/k$/, ''))) + 1;
    const title = it.step === 'adtext' || it.step === 'lander' ? it.title : (it.step === 'images' ? 'Image ' : 'Headline ') + num;
    const eyebrow = it.rewrite ? 'Studio\'s rewrite · ' + s.label : it.kept ? 'You kept this · ' + s.label : s.label;
    const tip = it.step === 'adtext' ? 'Tap a line, or highlight words, to leave a note.' : it.step === 'lander' ? 'Tap a section, or highlight words, to leave a note.' : '';
    app.innerHTML = `<div class="review">
      <div class="rtop gutter"><span class="logo">STUDIO</span><span class="where">${esc(C.offer)} · ${esc(C.name)}</span><span class="spacer"></span>
        ${S.round === 2 ? `<span class="seg"><button data-act="only-new" aria-pressed="${!S.everything}">Only new</button><button data-act="everything" aria-pressed="${S.everything}">Everything</button></span>` : ''}
        <span class="count">${S.i + 1} of ${q.length}</span><button class="x" data-act="home">Close</button></div>
      <div class="progress"><i style="width:${(S.i / q.length) * 100}%"></i></div>
      <div class="stage gutter" id="stage">
        <div class="head"><span class="eyebrow">${esc(eyebrow)}</span><h2 class="display">${esc(title.toUpperCase())}</h2></div>
        ${it.rewrite ? askedBox(it.base) : ''}
        <div class="deck ${anim ? 'enter' : ''} ${it.step === 'images' ? 'square' : ''}" id="deck">${it.step === 'lander' ? pageCard(it, r) : card(it, r)}</div>
        ${tip ? `<span class="tip">${tip}</span>` : ''}
      </div>
      <div class="dbar">
        <button class="dbtn back" data-act="back" ${S.i === 0 ? 'disabled' : ''} aria-label="Go back">↑</button>
        <button class="dbtn kill" data-act="kill">Kill</button>
        <button class="dbtn fix" data-act="fix">Fix</button>
        <button class="dbtn keep" data-act="keep">Keep</button>
      </div></div>`;
    const ta = document.getElementById('ask'); if (ta) ta.focus();
    bindSwipe();
  }
  function askedBox(baseId) {
    const notes = (S.d1[baseId] || { notes: [] }).notes;
    if (!notes.length) return '';
    return `<div class="asked"><b>You asked for</b>${notes.slice(0, 3).map(n => `<span>${n.line != null ? 'Line ' + (n.line + 1) + ': ' : ''}${esc(n.tags.concat(n.text ? [n.text] : []).join('. '))}</span>`).join('')}${notes.length > 3 ? `<span style="color:var(--muted)">+${notes.length - 3} more</span>` : ''}</div>`;
  }
  const fbHead = () => `<div class="fb-head"><span class="fb-av">${esc(C.offer.slice(0, 2).toUpperCase())}</span><div><b>${esc(C.offer)} News</b><small>Sponsored · 🌎</small></div></div>`;
  const fbLink = (t, big) => `<div class="fb-link ${big ? 'big' : ''}"><div><small>${esc(C.domain)}</small><strong>${esc(t)}</strong></div><span class="fb-btn">Learn more</span></div>`;
  function askBox(step, ph) {
    return `<div class="ask">${asking.quote ? `<q>"${esc(asking.quote)}"</q>` : ''}
      <div class="tags">${TAGS[step].map(t => `<button data-tag="${esc(t)}" aria-pressed="${asking.tags.has(t)}">${esc(t)}</button>`).join('')}</div>
      <textarea id="ask" placeholder="${ph}"></textarea>
      <div class="row2"><button class="cancel" data-act="cancel">Cancel</button><button class="save" data-act="save">${asking.thenFix ? 'Send back' : 'Save'}</button></div></div>`;
  }
  const noteRow = (x, k) => `<div class="note"><span>${x.quote ? '<i>"' + esc(x.quote) + '"</i> ' : ''}${x.tags.length ? '<b>' + esc(x.tags.join(', ')) + '</b>' + (x.text ? ': ' : '') : ''}${esc(x.text)}</span><button data-del="${k}" aria-label="Remove note">×</button></div>`;
  const notesAt = (r, line) => r.notes.map((x, k) => [x, k]).filter(([x]) => x.line === line).map(([x, k]) => noteRow(x, k)).join('');

  function card(it, r) {
    const firstImg = stepOf('images').items[0].src;
    const firstHl = stepOf('headlines').items[0].text;
    const whole = notesAt(r, null);
    const ask = asking && asking.line == null ? askBox(it.step, 'What should Studio change?') : '';
    if (it.step === 'headlines') return `<div class="fb">${fbHead()}<img class="wide" src="${firstImg}" alt="">${fbLink(it.text, true)}${whole}${ask}</div>`;
    if (it.step === 'images') {
      const main = it.rewrite && showBefore ? it.beforeSrc : it.src;
      const thumb = it.rewrite ? `<button class="before" data-act="swap" aria-label="Show the other version"><img src="${showBefore ? it.src : it.beforeSrc}" alt=""><span>${showBefore ? 'New' : 'Before'}</span></button>` : '';
      return `<div class="fb">${fbHead()}<div class="pic"><img src="${main}" alt="Ad image">${thumb}</div>${fbLink(firstHl)}${whole}${ask}</div>`;
    }
    const oldSet = it.rewrite ? new Set(R1.find(x => x.id === it.base).lines.map(l => l.trim())) : null;
    const lines = it.lines.map((l, n) => {
      const isNew = oldSet && !oldSet.has(l.trim());
      const ns = notesAt(r, n);
      return `<div role="button" tabindex="0" class="ln ${n === 0 ? 'first' : ''} ${isNew ? 'new' : ''} ${asking && asking.line === n ? 'on' : ''} ${ns ? 'noted' : ''}" data-line="${n}"><span class="no">${n + 1}</span><span class="tx">${esc(l)}</span></div>
        ${ns}${asking && asking.line === n ? askBox('adtext', 'What\'s wrong with this line?') : ''}`;
    }).join('');
    return `<div class="fb">${fbHead()}<div class="fb-body">${lines}</div>${whole}${ask}<img src="${firstImg}" alt="">${fbLink(firstHl)}
      <div class="fb-foot"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div></div>`;
  }
  function pageCard(it, r) {
    const secs = it.sections.map((sec, n) => {
      const ns = notesAt(r, n);
      const ps = sec.lines.map(l => /^WATCH|^CLICK|^SEE /i.test(l) ? `<span class="cta">${esc(l)}</span>` : `<p>${esc(l)}</p>`).join('');
      return `<div role="button" tabindex="0" class="sec ${n === 0 ? 'hero' : ''} ${sec.name === 'Fine print' ? 'fine' : ''} ${asking && asking.line === n ? 'on' : ''} ${ns ? 'noted' : ''}" data-line="${n}"><span class="lab">${esc(sec.name)}</span>${ps}</div>
        ${ns}${asking && asking.line === n ? askBox('lander', 'What should change in this section?') : ''}`;
    }).join('');
    const whole = notesAt(r, null);
    const ask = asking && asking.line == null ? askBox('lander', 'What should Studio change on this page?') : '';
    return `<div class="page"><div class="pbar">🔒 ${esc(C.domain.toLowerCase())}</div>${secs}${whole}${ask}</div>`;
  }

  function decide(v) {
    if (busy) return;
    const q = queue(); const it = q[S.i]; if (!it) return;
    const r = rec(it.id);
    if (v === 'fix' && !r.notes.length) { asking = { line: null, quote: '', tags: new Set(), thenFix: true }; return renderReview(false); }
    r.v = v; asking = null; showBefore = false; save();
    busy = true;
    const deck = document.getElementById('deck'); if (deck) deck.classList.add('out-' + v);
    setTimeout(() => {
      busy = false; const prev = q[S.i]; S.i++; save();
      const next = queue()[S.i];
      if (S.round === 1 && next && next.step !== prev.step) flash(next.step);
      renderReview(true);
      const st = document.getElementById('stage'); if (st) st.scrollTop = 0;
    }, 200);
  }
  function saveNote() {
    const ta = document.getElementById('ask'); const text = ta ? ta.value.trim() : '';
    const was = asking; asking = null;
    if (!text && !was.tags.size) return renderReview(false);
    rec(queue()[S.i].id).notes.push({ line: was.line, quote: was.quote || '', tags: [...was.tags], text }); save();
    if (was.thenFix) return decide('fix');
    renderReview(false);
  }
  function flash(key) {
    const s = stepOf(key); const f = document.createElement('div'); f.className = 'flash';
    f.innerHTML = `<div><div class="eyebrow">Up next · ${s.items.length} to go</div><div class="display">${s.label.toUpperCase()}</div></div>`;
    document.body.appendChild(f); setTimeout(() => f.remove(), 950);
  }

  // ---------- Round done ----------
  function finishRound() { G.view = 'done'; save(); renderDone(); }
  function tagCounts() {
    const c = {};
    [S.d1, S.d2].forEach(dd => Object.values(dd).forEach(r => r.notes.forEach(n => n.tags.forEach(t => { c[t] = (c[t] || 0) + 1; }))));
    return Object.entries(c).sort((a, b) => b[1] - a[1]);
  }
  function renderDone() {
    const items = queue(); const dd = D();
    const n = v => items.filter(it => dd[it.id] && dd[it.id].v === v).length;
    const sent = S.round === 1 ? S.sent1 : S.sent2;
    const skills = tagCounts().map(([t, k]) => {
      const on = !S.skip[t];
      return `<div class="skill"><div><small>You flagged "${esc(t)}" ${k} time${k > 1 ? 's' : ''}</small><b>${esc(RULES[t] || t)}</b></div>
        <div class="yn"><button class="y" data-skill="${esc(t)}" data-val="1" aria-pressed="${on}">Add</button><button class="n" data-skill="${esc(t)}" data-val="0" aria-pressed="${!on}">Skip</button></div></div>`;
    }).join('');
    const rw = rewrites();
    const waiting = R1.filter(it => S.d1[it.id] && S.d1[it.id].v === 'fix' && !rw.some(r => r.base === it.id));
    const nextUp = ordered().find(c => c.id !== C.id && status(c).rank < 3);
    let after;
    if (!sent) after = '<button class="btn red" data-act="send">Send to Studio</button>';
    else if (S.round === 1 && rw.length) after = '<div class="sent">Sent to Studio ✓</div><button class="btn primary" data-act="rewrite">▶ Review Studio\'s rewrite</button>';
    else after = `<div class="sent">Sent to Studio ✓</div>${nextUp ? `<button class="btn primary" data-open="${nextUp.id}">▶ Next: ${esc(nextUp.offer)} ${esc(nextUp.name)}</button>` : ''}`;
    app.innerHTML = `<div class="wrapup gutter">
      <div><div class="eyebrow">${esc(C.offer)} · ${esc(C.name)} · ${esc(C.date)}</div><h1 class="display">ROUND ${S.round} DONE</h1></div>
      <div class="tiles">
        <div class="tile keep"><span class="display">${n('keep')}</span><small>Kept</small></div>
        <div class="tile fix"><span class="display">${n('fix')}</span><small>To fix</small></div>
        <div class="tile kill"><span class="display">${n('kill')}</span><small>Killed</small></div>
      </div>
      ${skills ? `<div class="skills"><h3>SKILL UPDATES FOR FERNANDO</h3><p>Your repeat notes, written as rules for Studio's skills.</p>${skills}</div>` : ''}
      ${after}
      ${sent && S.round === 1 && waiting.length ? `<p class="waiting">${waiting.length} sent-back ${waiting.length === 1 ? 'piece has' : 'pieces have'} no new version in this demo yet (${esc(waiting.map(w => stepOf(w.step).label.toLowerCase()).filter((x, i, a) => a.indexOf(x) === i).join(', '))}).</p>` : ''}
      <div class="links"><button data-act="back">Change something</button><button data-act="home">Home</button><button data-act="reset">Start over</button></div>
    </div>`;
  }
  function send() {
    const items = queue(); const dd = D();
    const payload = {
      campaign: C.id, offer: C.offer, name: C.name, round: S.round,
      items: items.map(it => ({ id: it.base || it.id, kind: it.step, version: it.rewrite ? 'rewrite' : 'first', decision: (dd[it.id] || {}).v || 'skipped',
        notes: ((dd[it.id] || {}).notes || []).map(x => ({ [it.step === 'lander' ? 'section' : 'line']: x.line == null ? null : (it.step === 'lander' ? it.sections[x.line].name : x.line + 1), words: x.quote || null, tags: x.tags, note: x.text || null })) })),
      skillUpdates: tagCounts().filter(([t]) => !S.skip[t]).map(([t, k]) => ({ tag: t, times: k, rule: RULES[t] || t }))
    };
    try { navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).catch(() => {}); } catch (e) {}
    if (S.round === 1) S.sent1 = true; else S.sent2 = true;
    save(); renderDone();
  }

  // ---------- Routing and input ----------
  function render() { if (G.view !== 'home' && !C) G.view = 'home'; G.view === 'home' ? renderHome() : G.view === 'review' ? renderReview(true) : renderDone(); window.scrollTo(0, 0); }
  function go(view) { G.view = view; asking = null; showBefore = false; save(); render(); }
  function firstOpen() { const q = queue(); const i = q.findIndex(it => !(D()[it.id] && D()[it.id].v)); return i >= 0 ? i : 0; }
  function startRound(round) { S.round = round; S.i = firstOpen(); go('review'); }

  app.addEventListener('click', e => {
    const t = e.target.closest('button, [data-line]'); if (!t) return;
    if (t.dataset.open) return open(t.dataset.open);
    if (t.dataset.tag) { const v = t.dataset.tag; asking.tags.has(v) ? asking.tags.delete(v) : asking.tags.add(v); const ta = document.getElementById('ask'); const keep = ta ? ta.value : ''; renderReview(false); const nt = document.getElementById('ask'); if (nt) nt.value = keep; return; }
    if (t.dataset.skill) { S.skip[t.dataset.skill] = t.dataset.val === '0'; save(); return renderDone(); }
    if (t.dataset.line != null) {
      if (Date.now() - justSelected < 500) return;
      const s = window.getSelection(); if (s && String(s).trim()) return;
      asking = { line: +t.dataset.line, quote: '', tags: new Set(), thenFix: false }; return renderReview(false);
    }
    if (t.dataset.del != null) { rec(queue()[S.i].id).notes.splice(+t.dataset.del, 1); save(); return renderReview(false); }
    const a = t.dataset.act;
    if (a === 'keep' || a === 'kill' || a === 'fix') return decide(a);
    if (a === 'back') { if (S.i > 0) { S.i = Math.min(S.i, queue().length) - 1; if (S.round === 1) S.sent1 = false; else S.sent2 = false; go('review'); } return; }
    if (a === 'save') return saveNote();
    if (a === 'cancel') { asking = null; return renderReview(false); }
    if (a === 'swap') { showBefore = !showBefore; return renderReview(false); }
    if (a === 'only-new' || a === 'everything') { S.everything = a === 'everything'; S.i = firstOpen(); save(); return renderReview(true); }
    if (a === 'home') return go('home');
    if (a === 'rewrite') return startRound(2);
    if (a === 'send') return send();
    if (a === 'reset') { G.by[C.id] = freshC(); use(C.id); save(); return go('home'); }
  });
  // Highlight exact words inside a line or section.
  app.addEventListener('mouseup', () => {
    if (G.view !== 'review' || asking) return;
    const s = window.getSelection(); const text = s && String(s).trim(); if (!text) return;
    const node = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
    const host = node && node.closest('[data-line]'); if (!host) return;
    s.removeAllRanges(); justSelected = Date.now();
    asking = { line: +host.dataset.line, quote: text, tags: new Set(), thenFix: false }; renderReview(false);
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA') {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); }
      if (e.key === 'Escape') { asking = null; renderReview(false); }
      return;
    }
    if (G.view !== 'review') return;
    const map = { ArrowRight: 'keep', ArrowLeft: 'kill', ArrowDown: 'fix' };
    if (map[e.key]) { e.preventDefault(); return decide(map[e.key]); }
    if (e.key === 'ArrowUp' && S.i > 0) { e.preventDefault(); S.i--; asking = null; save(); renderReview(true); }
  });

  // Swipe on phones for headlines and images (ad text and landers need to scroll).
  function bindSwipe() {
    const deck = document.getElementById('deck'); const it = queue()[S.i];
    if (!deck || !it || it.step === 'adtext' || it.step === 'lander') return;
    let x0 = null, y0 = 0, dx = 0, dy = 0;
    deck.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' || asking || e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; deck.setPointerCapture(e.pointerId); });
    deck.addEventListener('pointermove', e => { if (x0 == null) return; dx = e.clientX - x0; dy = e.clientY - y0; deck.style.transform = `translate(${dx}px, ${Math.max(0, dy)}px) rotate(${dx / 22}deg)`; });
    const end = () => { if (x0 == null) return; x0 = null; deck.style.transform = ''; if (dx > 90) decide('keep'); else if (dx < -90) decide('kill'); else if (dy > 90) decide('fix'); dx = dy = 0; };
    deck.addEventListener('pointerup', end); deck.addEventListener('pointercancel', end);
  }

  render();
})();
</script>
